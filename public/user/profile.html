<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Nettech Help Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
  <!-- Dynamic navigation based on role -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#" id="brandLink">
        <i class="bi bi-headset"></i>
        <span>Nettech Help Desk</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navCollapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="navLinks">
          <!-- Dynamically populated -->
        </ul>
        <div class="d-flex align-items-center gap-3">
          <img id="navbarAvatar" src="" class="avatar-img d-none" alt="Profile">
          <span class="text-white small fw-medium" id="navbarUserDisplay">User</span>
          <button id="logoutBtn" class="btn btn-outline-light btn-sm px-3">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="mb-4">
          <h2 class="fw-bold mb-1">Account Profile</h2>
          <p class="text-muted">Manage your personal information, profile photo and account password.</p>
        </div>

        <div class="card border-0 shadow-sm p-4 mb-4">
          <div class="d-flex flex-column flex-sm-row align-items-center gap-4 mb-4 pb-4 border-bottom">
            <div class="position-relative">
              <img id="profileAvatarImg" src="" class="avatar-lg d-none" alt="Avatar">
              <div id="profileAvatarPlaceholder" class="avatar-placeholder-lg">U</div>
            </div>
            <div class="text-center text-sm-start flex-grow-1">
              <h4 class="fw-bold mb-1" id="profileNameDisplay">User Name</h4>
              <p class="text-muted mb-2" id="profileEmailDisplay">user@example.com</p>
              <div>
                <span id="profileRoleBadge" class="badge bg-primary text-uppercase px-3 py-1">user</span>
              </div>
            </div>
            <!-- Bonus Task 15: Upload Profile Picture Form -->
            <div>
              <form id="avatarUploadForm" enctype="multipart/form-data">
                <input type="file" id="avatarFileInput" name="avatar" class="d-none" accept="image/*">
                <button type="button" id="changePhotoBtn" class="btn btn-outline-primary btn-sm fw-semibold">
                  <i class="bi bi-camera me-1"></i> Change Photo
                </button>
              </form>
            </div>
          </div>

          <div id="profileAlertBox" class="alert alert-danger d-none" role="alert"></div>

          <form id="profileForm" novalidate>
            <h5 class="fw-bold mb-3">Edit Details</h5>

            <div class="mb-3">
              <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="name" required minlength="2">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" required>
            </div>

            <hr class="my-4">
            <h5 class="fw-bold mb-3">Security & Password</h5>
            <p class="text-muted small">Leave password fields blank if you do not want to change your password.</p>

            <div class="mb-3">
              <label for="newPassword" class="form-label fw-semibold">New Password</label>
              <input type="password" class="form-control" id="newPassword" placeholder="Min 6 characters">
            </div>

            <div class="mb-4">
              <label for="confirmNewPassword" class="form-label fw-semibold">Confirm New Password</label>
              <input type="password" class="form-control" id="confirmNewPassword" placeholder="Repeat new password">
            </div>

            <div class="d-flex justify-content-end">
              <button type="submit" id="saveProfileBtn" class="btn btn-primary px-4 fw-semibold shadow-sm">
                <span id="saveBtnText">Save Changes</span>
                <span id="saveBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">&copy; 2026 Nettech Help Desk Management System.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    if (!checkPageAuth()) {
      // redirected
    }

    const role = localStorage.getItem('role');
    const brandLink = document.getElementById('brandLink');
    const navLinks = document.getElementById('navLinks');

    if (role === 'admin') {
      brandLink.href = '/admin/dashboard.html';
      navLinks.innerHTML = `
        <li class="nav-item"><a class="nav-link" href="/admin/dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/tickets.html">Manage Tickets</a></li>
        <li class="nav-item"><a class="nav-link active fw-semibold" href="/user/profile.html">Profile</a></li>
      `;
    } else {
      brandLink.href = '/user/dashboard.html';
      navLinks.innerHTML = `
        <li class="nav-item"><a class="nav-link" href="/user/dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/user/my-tickets.html">My Tickets</a></li>
        <li class="nav-item"><a class="nav-link" href="/user/raise-ticket.html">Raise Ticket</a></li>
        <li class="nav-item"><a class="nav-link active fw-semibold" href="/user/profile.html">Profile</a></li>
      `;
    }

    setupNavbar();

    const profileNameDisplay = document.getElementById('profileNameDisplay');
    const profileEmailDisplay = document.getElementById('profileEmailDisplay');
    const profileRoleBadge = document.getElementById('profileRoleBadge');
    const profileAvatarImg = document.getElementById('profileAvatarImg');
    const profileAvatarPlaceholder = document.getElementById('profileAvatarPlaceholder');

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmNewPasswordInput = document.getElementById('confirmNewPassword');
    const profileForm = document.getElementById('profileForm');
    const profileAlertBox = document.getElementById('profileAlertBox');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const saveBtnText = document.getElementById('saveBtnText');
    const saveBtnSpinner = document.getElementById('saveBtnSpinner');

    // Avatar upload setup
    const changePhotoBtn = document.getElementById('changePhotoBtn');
    const avatarFileInput = document.getElementById('avatarFileInput');

    changePhotoBtn.addEventListener('click', () => {
      avatarFileInput.click();
    });

    avatarFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('avatar', file);

      try {
        changePhotoBtn.disabled = true;
        changePhotoBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Uploading...';
        
        const data = await apiFetch('/users/me/avatar', {
          method: 'POST',
          body: formData
        });

        showToast('Profile photo updated!', 'success');
        if (data.profilePic) {
          profileAvatarImg.src = data.profilePic;
          profileAvatarImg.classList.remove('d-none');
          profileAvatarPlaceholder.classList.add('d-none');

          const navAvatar = document.getElementById('navbarAvatar');
          if (navAvatar) {
            navAvatar.src = data.profilePic;
            navAvatar.classList.remove('d-none');
          }

          const localUser = getAuthUser() || {};
          localUser.profilePic = data.profilePic;
          localStorage.setItem('user', JSON.stringify(localUser));
        }
      } catch (err) {
        showToast(err.message || 'Avatar upload failed', 'error');
      } finally {
        changePhotoBtn.disabled = false;
        changePhotoBtn.innerHTML = '<i class="bi bi-camera me-1"></i> Change Photo';
      }
    });

    async function loadProfile() {
      try {
        const user = await apiFetch('/users/me');
        nameInput.value = user.name || '';
        emailInput.value = user.email || '';
        profileNameDisplay.textContent = user.name || 'User';
        profileEmailDisplay.textContent = user.email || '';
        profileRoleBadge.textContent = user.role || 'user';

        if (user.profilePic) {
          profileAvatarImg.src = user.profilePic;
          profileAvatarImg.classList.remove('d-none');
          profileAvatarPlaceholder.classList.add('d-none');
        } else {
          profileAvatarPlaceholder.textContent = (user.name ? user.name[0] : 'U').toUpperCase();
          profileAvatarPlaceholder.classList.remove('d-none');
          profileAvatarImg.classList.add('d-none');
        }

        // Keep local cache fresh
        localStorage.setItem('user', JSON.stringify(user));
        setupNavbar();
      } catch (err) {
        profileAlertBox.textContent = err.message || 'Failed to load profile data.';
        profileAlertBox.classList.remove('d-none');
      }
    }

    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      profileAlertBox.classList.add('d-none');
      profileAlertBox.textContent = '';

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = newPasswordInput.value;
      const confirmPassword = confirmNewPasswordInput.value;

      if (!name || !email) {
        profileAlertBox.textContent = 'Name and email are required.';
        profileAlertBox.classList.remove('d-none');
        return;
      }

      if (password) {
        if (password.length < 6) {
          profileAlertBox.textContent = 'New password must be at least 6 characters.';
          profileAlertBox.classList.remove('d-none');
          return;
        }
        if (password !== confirmPassword) {
          profileAlertBox.textContent = 'New passwords do not match.';
          profileAlertBox.classList.remove('d-none');
          return;
        }
      }

      saveBtnText.textContent = 'Saving...';
      saveBtnSpinner.classList.remove('d-none');
      saveProfileBtn.disabled = true;

      try {
        const updateData = { name, email };
        if (password) {
          updateData.password = password;
        }

        const res = await apiFetch('/users/me', {
          method: 'PUT',
          body: JSON.stringify(updateData)
        });

        showToast('Profile updated successfully!', 'success');
        newPasswordInput.value = '';
        confirmNewPasswordInput.value = '';
        if (res.user) {
          localStorage.setItem('user', JSON.stringify(res.user));
          profileNameDisplay.textContent = res.user.name;
          profileEmailDisplay.textContent = res.user.email;
          setupNavbar();
        }
      } catch (err) {
        profileAlertBox.textContent = err.message || 'Failed to update profile';
        profileAlertBox.classList.remove('d-none');
      } finally {
        saveBtnText.textContent = 'Save Changes';
        saveBtnSpinner.classList.add('d-none');
        saveProfileBtn.disabled = false;
      }
    });

    loadProfile();
  </script>
</body>
</html>
