<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Nettech Help Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
          <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none text-primary fs-3 fw-bold">
            <i class="bi bi-headset fs-2"></i>
            <span>Nettech Help Desk</span>
          </a>
          <p class="text-muted small mt-1">Sign in to manage and raise support tickets</p>
        </div>

        <div class="card p-4 shadow-sm border-0">
          <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
              </div>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
              <span id="btnText">Sign In</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
          </form>

          <hr class="my-4 text-muted">

          <div class="text-center small">
            Don't have an account? <a href="/register.html" class="fw-semibold text-primary text-decoration-none">Register here</a>
          </div>
        </div>

        <div class="text-center mt-3 text-muted small">
          <a href="/" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // Redirect if already logged in
    if (getAuthToken()) {
      const role = localStorage.getItem('role');
      window.location.href = role === 'admin' ? '/admin/dashboard.html' : '/user/dashboard.html';
    }

    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePassword.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      alertBox.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alertBox.textContent = 'Please provide both email and password.';
        alertBox.classList.remove('d-none');
        return;
      }

      btnText.textContent = 'Signing In...';
      btnSpinner.classList.remove('d-none');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }

        setAuthData(data.token, data.role, data.user);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          if (data.role === 'admin') {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = '/user/dashboard.html';
          }
        }, 600);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      } finally {
        btnText.textContent = 'Sign In';
        btnSpinner.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
