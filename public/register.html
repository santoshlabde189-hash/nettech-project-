<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Nettech Help Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
          <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none text-primary fs-3 fw-bold">
            <i class="bi bi-headset fs-2"></i>
            <span>Nettech Help Desk</span>
          </a>
          <p class="text-muted small mt-1">Create an employee account to raise and track support requests</p>
        </div>

        <div class="card p-4 shadow-sm border-0">
          <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="name" placeholder="John Doe" required minlength="2">
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="john.doe@company.com" required>
              </div>
              <div class="form-text">Must be a valid email address.</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6">
              </div>
              <div class="form-text">Minimum 6 characters.</div>
            </div>

            <div class="mb-4">
              <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
              <span id="btnText">Create Account</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
          </form>

          <hr class="my-4 text-muted">

          <div class="text-center small">
            Already registered? <a href="/login.html" class="fw-semibold text-primary text-decoration-none">Sign in here</a>
          </div>
        </div>

        <div class="text-center mt-3 text-muted small">
          <a href="/" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    if (getAuthToken()) {
      const role = localStorage.getItem('role');
      window.location.href = role === 'admin' ? '/admin/dashboard.html' : '/user/dashboard.html';
    }

    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      alertBox.textContent = '';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!name || !email || !password) {
        alertBox.textContent = 'Please fill in all required fields.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (password.length < 6) {
        alertBox.textContent = 'Password must be at least 6 characters long.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (password !== confirmPassword) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.classList.remove('d-none');
        return;
      }

      btnText.textContent = 'Creating Account...';
      btnSpinner.classList.remove('d-none');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Registration failed');
        }

        setAuthData(data.token, data.role, data.user);
        showToast('Registration successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = '/user/dashboard.html';
        }, 600);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      } finally {
        btnText.textContent = 'Create Account';
        btnSpinner.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
